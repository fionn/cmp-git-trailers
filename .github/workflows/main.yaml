name: CI

on: [push]

permissions:
  contents: read

jobs:

  lint:

    name: Lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: $/.github/actions/setup-nvim
        with:
          version: v0.12.6

      - name: Install nvim-cmp
        run: nvim -u NONE -l - <<< "vim.pack.add({\"https://github.com/hrsh7th/nvim-cmp\"}, {confirm = false})"

      - name: Install LuaLS
        run: |
          gh release download 3.19.1 --repo LuaLS/lua-language-server --pattern "lua-language-server-*-linux-x64.tar.gz"
          sudo mkdir /opt/lua-language-server
          sudo tar -C /opt/lua-language-server -xzf lua-language-server-*-linux-x64.tar.gz
          sudo ln -s /opt/lua-language-server/bin/lua-language-server /usr/bin/lua-language-server

      - name: Install EmmyLua
        run: |
          gh release download 0.25.1 --repo EmmyLuaLs/emmylua-analyzer-rust --pattern emmylua_check-linux-x64.tar.gz
          sudo tar -C /usr/bin -xzf emmylua_check-linux-x64.tar.gz

      - name: Lint with LuaLS
        run: lua-language-server --check .
        env:
          VIMRUNTIME: /usr/share/nvim/runtime
          XDG_DATA_HOME: /home/runner/.local/share

      - name: Lint with EmmyLua
        run: emmylua_check --config .luarc.json --output-format github --warnings-as-errors --ignore after/plugin/cmp_git_trailers.lua .
        env:
          VIMRUNTIME: /usr/share/nvim/runtime
          XDG_DATA_HOME: /home/runner/.local/share
